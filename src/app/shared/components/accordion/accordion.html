<button
  type="button"
  class="accordion__button"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="panelId()"
  (click)="expanded.set(!expanded())"
>
  <span class="accordion__label">{{ label() }}</span>
  @if (summary(); as summary) {
    <span class="accordion__summary">{{ summary }}</span>
  }
  @if (count()) {
    <span class="accordion__badge">
      {{ count() }}
      <span class="visually-hidden">{{ count() === 1 ? 'seleccionat' : 'seleccionats' }}</span>
    </span>
  }
  <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
</button>
<div class="accordion__panel" [id]="panelId()" [hidden]="!expanded()">
  <ng-content />
</div>
