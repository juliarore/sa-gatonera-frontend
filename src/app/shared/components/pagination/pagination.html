@if (totalPages() > 1) {
  <nav class="pagination" aria-label="Paginació">
    <ul class="pagination__list">
      <li>
        @if (page() > 1) {
          <a
            class="pagination__item"
            [routerLink]="[]"
            [queryParams]="queryParams(page() - 1)"
            queryParamsHandling="merge"
            aria-label="Pàgina anterior"
            (click)="pageSelect.emit()"
          >
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </a>
        } @else {
          <span class="pagination__item pagination__item--disabled" aria-hidden="true">
            <i class="fa-solid fa-chevron-left"></i>
          </span>
        }
      </li>

      @for (item of pages(); track $index) {
        @if (item === null) {
          <li class="pagination__gap" aria-hidden="true">…</li>
        } @else {
          <li>
            <a
              class="pagination__item"
              [class.pagination__item--current]="item === page()"
              [routerLink]="[]"
              [queryParams]="queryParams(item)"
              queryParamsHandling="merge"
              [attr.aria-current]="item === page() ? 'page' : null"
              [attr.aria-label]="'Pàgina ' + item"
              (click)="pageSelect.emit()"
              >{{ item }}</a
            >
          </li>
        }
      }

      <li>
        @if (page() < totalPages()) {
          <a
            class="pagination__item"
            [routerLink]="[]"
            [queryParams]="queryParams(page() + 1)"
            queryParamsHandling="merge"
            aria-label="Pàgina següent"
            (click)="pageSelect.emit()"
          >
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
          </a>
        } @else {
          <span class="pagination__item pagination__item--disabled" aria-hidden="true">
            <i class="fa-solid fa-chevron-right"></i>
          </span>
        }
      </li>
    </ul>
  </nav>
}
