@if (totalPages() > 1) {
  <nav aria-label="Paginació">
    <ul class="pagination" [class]="'pagination--' + variant()" role="list">
      @for (slot of slots(); track $index) {
        <li
          [class.pagination__slot--desktop]="slot.only === 'desktop'"
          [class.pagination__slot--mobile]="slot.only === 'mobile'"
        >
          @if (slot.item; as item) {
            @if (links() && !item.disabled) {
              <a
                class="pagination__item"
                [class.pagination__item--current]="item.current"
                [routerLink]="[]"
                [queryParams]="{ page: item.page === 1 ? null : item.page }"
                queryParamsHandling="merge"
                [attr.aria-current]="item.current ? 'page' : null"
                [attr.aria-label]="item.label"
                (click)="select(item)"
              >
                <ng-container *ngTemplateOutlet="content; context: { $implicit: item }" />
              </a>
            } @else {
              <button
                type="button"
                class="pagination__item"
                [class.pagination__item--current]="item.current"
                [disabled]="item.disabled"
                [attr.aria-current]="item.current ? 'page' : null"
                [attr.aria-label]="item.label"
                (click)="select(item)"
              >
                <ng-container *ngTemplateOutlet="content; context: { $implicit: item }" />
              </button>
            }
          } @else {
            <span class="pagination__gap" aria-hidden="true">…</span>
          }
        </li>
      }
    </ul>
  </nav>
}

<ng-template #content let-item>
  @if (item.icon) {
    <i class="fa-solid" [class]="item.icon" aria-hidden="true"></i>
  } @else {
    {{ item.page }}
  }
</ng-template>
