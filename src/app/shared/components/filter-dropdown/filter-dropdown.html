<div class="filter-dropdown" [appDisclosure]="'filter-panel-' + name()" #disclosure="disclosure">
  <button
    #trigger
    type="button"
    class="filter-dropdown__button"
    [class.filter-dropdown__button--active]="selected().length"
    [attr.aria-expanded]="disclosure.isOpen()"
    [attr.aria-controls]="disclosure.panelId()"
    (click)="disclosure.toggle()"
  >
    {{ label() }}
    @if (selected().length) {
      <span class="filter-dropdown__badge">
        {{ selected().length }}
        <span class="visually-hidden">
          {{ selected().length === 1 ? 'seleccionat' : 'seleccionats' }}
        </span>
      </span>
    }
    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>

  <div class="filter-dropdown__panel" [id]="disclosure.panelId()" [hidden]="!disclosure.isOpen()">
    <app-filter-options
      [name]="disclosure.panelId()"
      [legend]="label()"
      [options]="options()"
      [selected]="selected()"
      [multiple]="multiple()"
      [allLabel]="allLabel()"
      (selectedChange)="selectedChange.emit($event)"
    />
  </div>
</div>
