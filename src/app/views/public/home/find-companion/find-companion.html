<section class="find-companion" aria-labelledby="find-companion-title">
  <div class="find-companion__content">
    <h2 id="find-companion-title">Troba el teu company de vida</h2>
    <p>
      Cada gat és únic, i cada família també. Respon unes preguntes sobre les teves preferències i
      descobreix quins gats podrien encaixar millor amb tu.
    </p>
    <a class="btn btn--primary" [routerLink]="findCompanionPath">
      Començar el test
    </a>
  </div>
  <app-responsive-image
    class="find-companion__image media"
    src="images/home/find-companion/troba-company-gats"
    alt="Dos gats estirats al sol, mirant a càmera"
    [sizes]="imageSizes"
    [widths]="[656, 1200]"
    [width]="1200"
    [height]="800"
  />
</section>
