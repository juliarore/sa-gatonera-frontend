<section class="collaborate" aria-labelledby="collaborate-title">
  <h2 id="collaborate-title">Col·labora amb nosaltres</h2>
  <ul class="collaborate__options" role="list">
    @for (option of options; track option.id) {
      <li>
        <a class="collaborate__option" [routerLink]="path" [fragment]="option.id">
          <img
            class="collaborate__icon"
            [src]="option.icon"
            alt=""
            width="99"
            height="99"
            loading="lazy"
            decoding="async"
          />
          <h3>{{ option.title }}</h3>
          <p>{{ option.text }}</p>
        </a>
      </li>
    }
  </ul>
</section>
