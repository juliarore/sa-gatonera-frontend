<section class="home-collaborate" aria-labelledby="home-collaborate-title">
  <h2 id="home-collaborate-title">Col·labora amb nosaltres</h2>
  <ul class="home-collaborate__options" role="list">
    @for (option of options; track option.id) {
      <li>
        <a class="home-collaborate__option" [routerLink]="path" [fragment]="option.id">
          <img
            class="home-collaborate__icon"
            [src]="option.icon"
            alt=""
            width="99"
            height="99"
            loading="lazy"
            decoding="async"
          />
          <h3>{{ option.title }}</h3>
          <p>{{ option.text }}</p>
        </a>
      </li>
    }
  </ul>
</section>
